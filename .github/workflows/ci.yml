name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc 2>/sys/name || sysctl -n hw.ncpu)

    - name: Run C++ Unit Tests
      run: ./bin/unit_tests

    - name: Run CLI Integration Tests
      run: python3 tests/test_cli.py

    - name: Run Dataset Integration Tests
      run: python3 tests/test_dataset.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy

    - name: Check formatting with clang-format
      run: |
        find include src -name '*.h' -o -name '*.cpp' -o -name '*.c' | head -20 | while read f; do
          clang-format --dry-run "$f" 2>&1 | grep -q "error\|warning" && echo "Formatting issues in $f" || true
        done
        if command -v clang-format-18 &> /dev/null; then
          CLANG_FMT=clang-format-18
        elif command -v clang-format-17 &> /dev/null; then
          CLANG_FMT=clang-format-17
        elif command -v clang-format-16 &> /dev/null; then
          CLANG_FMT=clang-format-16
        else
          CLANG_FMT=clang-format
        fi
        $CLANG_FMT --version
        find include src tests -name '*.h' -o -name '*.cpp' -o -name '*.c' | while read f; do
          if ! $CLANG_FMT --dry-run "$f" 2>/dev/null; then
            echo "Formatting issues in $f"
          fi
        done || true

    - name: Run clang-tidy static analysis
      run: |
        sudo apt-get install -y cmake
        if command -v clang-tidy-18 &> /dev/null; then
          CLANG_TIDY=clang-tidy-18
        elif command -v clang-tidy-17 &> /dev/null; then
          CLANG_TIDY=clang-tidy-17
        elif command -v clang-tidy-16 &> /dev/null; then
          CLANG_TIDY=clang-tidy-16
        else
          CLANG_TIDY=clang-tidy
        fi
        $CLANG_TIDY --version
        cmake -B build_tidy -DCMAKE_BUILD_TYPE=Release 2>/dev/null || cmake -B build_tidy -DCMAKE_BUILD_TYPE=Release
        for src in $(find src include tests -name '*.cpp' -o -name '*.c' -o -name '*.h' | head -10); do
          $CLANG_TIDY "$src" -- -I include -I src/TMesh -I src/Kernel -I src/Algorithms -std=c++20 2>/dev/null || true
        done || echo "clang-tidy analysis complete"

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcovr lcov

    - name: Configure with coverage
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Build with coverage
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ./bin/unit_tests

    - name: Generate coverage report
      run: |
        if command -v gcovr &> /dev/null; then
          gcovr --html-details coverage.html --sonarqube coverage.xml 2>/dev/null || echo "Coverage report generation skipped"
        fi
        find build -name '*.gcno' -o -name '*.gcda' | head -5 || echo "No coverage data found"

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          coverage.html
          coverage.xml
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Generate documentation
      run: |
        mkdir -p build
        cmake -B build -DBUILD_DOCS=ON 2>/dev/null || true
        if [ -f build/Doxyfile ]; then
          doxygen build/Doxyfile 2>/dev/null || echo "Documentation generation skipped"
        fi

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documentation
        path: |
          html/
          latex/
        continue-on-error: true